name: Comprobar fuentes RSS

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m periodico fuentes
